<style>
:root{--h:210;--bg:#050507;--card:#111218;--ink:#e6e8ef;--muted:#9a9eaf;--line:#2a2c36;--acc:hsl(var(--h) 85% 62%);--accink:#050507;--code:#000;--ok:#4cd39a;
--sil1:#f2f3f6;--sil2:#aeb2bd;--silink:#15161b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;line-height:1.7;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);background:var(--bg);z-index:20}
.gate{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.gate h1{font-size:34px;margin:0;color:var(--acc)}
.gate input{font:inherit;width:100%;max-width:300px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center;font-size:18px}
.err{color:#ff7a7a;min-height:24px}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:9;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:26px;color:var(--acc);line-height:1.2}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.bar{display:flex;gap:8px;align-items:center}
select{flex:1;min-width:0;font:inherit;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nav,.rv{font:inherit;font-weight:800;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0 14px}
.rv[aria-pressed=true]{background:linear-gradient(135deg,var(--sil1),var(--sil2));color:var(--silink);border-color:var(--sil1)}
.nav:disabled{opacity:.35}
main{padding:14px;max-width:760px;margin:0 auto}
.sec{margin:22px 0 8px;font-weight:800;font-size:17px;color:var(--acc)}
.sec.r{color:var(--sil1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.card.r{background:linear-gradient(135deg,var(--sil1),var(--sil2));color:var(--silink);border-color:#fff}
.qn{font-weight:800;margin-bottom:6px}
.row{display:flex;gap:8px;align-items:stretch;margin:6px 0}
.row>pre,.row>.text{flex:1;min-width:0}
.copy{font:inherit;font-weight:800;border:0;border-radius:10px;background:var(--acc);color:var(--accink);padding:0 16px;min-height:44px;cursor:pointer}
.r .copy{background:var(--silink);color:var(--sil1)}
.copy.done{background:var(--ok);color:#000}
pre{direction:ltr;text-align:left;margin:0;background:var(--code);color:#e8ecf8;border-radius:10px;padding:10px;overflow-x:auto;font:14px/1.6 'JetBrains Mono',ui-monospace,monospace}
.text{font-weight:800;font-size:19px;padding:8px 12px;background:rgba(127,127,140,.18);border-radius:10px;overflow-wrap:anywhere}
.note,.action{color:var(--muted);font-size:14px}.r .note,.r .action{color:#33353f}
details{margin-top:6px}summary{font-size:13px;color:var(--muted);cursor:pointer;min-height:30px}.r summary{color:#33353f}
.hint{white-space:pre-wrap;font-size:13px;opacity:.85;overflow-wrap:anywhere}
.part{font-size:12px;opacity:.7}
.empty{color:var(--muted);text-align:center;padding:30px 0}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function unlock(pw){

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function render(i){
